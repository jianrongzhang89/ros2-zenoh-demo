apiVersion: apps/v1
kind: Deployment
metadata:
  name: nav2
  namespace: ros2-zenoh-gazebo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nav2
  template:
    metadata:
      labels:
        app: nav2
    spec:
      securityContext:
        runAsNonRoot: true

      initContainers:
        - name: wait-for-router
          image: quay.io/jianrzha/ros2-zenoh-nav2:latest
          command:
            - python3
            - -c
            - |
              import socket, time, sys
              print("Waiting for zenoh-router:7447 ...")
              while True:
                  try:
                      s = socket.create_connection(("zenoh-router", 7447), timeout=2)
                      s.close()
                      print("Router is up.")
                      sys.exit(0)
                  except OSError:
                      time.sleep(1)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

      containers:
        # ── Container 1: Nav2 navigation stack ───────────────────────────────
        # Odom-frame navigation: no AMCL or lidar required.
        # CycloneDDS matches zenoh-bridge-ros2dds bundled CycloneDDS, fixing
        # the "Bad Parameter" DDS writer error seen with FastRTPS.
        - name: nav2-server
          image: quay.io/jianrzha/ros2-zenoh-nav2:latest
          command:
            - bash
            - -c
            - |
              source /opt/ros/jazzy/setup.bash
              echo "Waiting 60 s for zenoh routes to establish and simulation to publish..."
              sleep 60
              echo "Launching Nav2 (odom-frame, CycloneDDS, no AMCL)..."
              exec ros2 launch nav2_bringup bringup_launch.py \
                use_sim_time:=true \
                params_file:=/etc/nav2/nav2_params.yaml \
                autostart:=true \
                use_composition:=False
          env:
            - name: ROS_AUTOMATIC_DISCOVERY_RANGE
              value: LOCALHOST
            - name: RMW_IMPLEMENTATION
              value: rmw_cyclonedds_cpp
            - name: ROS_HOME
              value: /tmp
          volumeMounts:
            - name: nav2-params
              mountPath: /etc/nav2
            - name: nav2-map
              mountPath: /map
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi

        # ── Container 2: Patrol mission controller ───────────────────────────
        - name: mission
          image: quay.io/jianrzha/ros2-zenoh-nav2:latest
          command:
            - bash
            - -c
            - |
              source /opt/ros/jazzy/setup.bash
              echo "Waiting 120 s for Nav2 to fully initialize..."
              sleep 120
              echo "Starting patrol mission..."
              exec python3 /mission/patrol.py
          env:
            - name: ROS_AUTOMATIC_DISCOVERY_RANGE
              value: LOCALHOST
            - name: RMW_IMPLEMENTATION
              value: rmw_cyclonedds_cpp
            - name: ROS_HOME
              value: /tmp
          volumeMounts:
            - name: nav2-mission
              mountPath: /mission
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

        # ── Container 3: zenoh-bridge sidecar ────────────────────────────────
        # Bridges CycloneDDS ↔ Zenoh router.
        # Inbound  (Zenoh→DDS): /odom /tf /clock from gazebo-sim
        # Outbound (DDS→Zenoh): /cmd_vel from Nav2
        - name: zenoh-bridge
          image: docker.io/eclipse/zenoh-bridge-ros2dds:latest
          args: ["-c", "/etc/zenoh/bridge.json5"]
          env:
            - name: ROS_AUTOMATIC_DISCOVERY_RANGE
              value: LOCALHOST
          volumeMounts:
            - name: zenoh-bridge-config
              mountPath: /etc/zenoh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: nav2-params
          configMap:
            name: nav2-params
        - name: nav2-map
          configMap:
            name: nav2-map
        - name: nav2-mission
          configMap:
            name: nav2-mission
            defaultMode: 0755
        - name: zenoh-bridge-config
          configMap:
            name: zenoh-bridge-config
