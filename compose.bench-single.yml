services:

  # ── Single Zenoh router ──────────────────────────────────────────────────
  zenoh-router:
    image: ${ROUTER_IMAGE:-quay.io/ecosystem-appeng/zenoh-router}:${ROUTER_TAG:-1.9.0}
    platform: linux/arm64
    command: ["-c", "/etc/zenoh/router.json5"]
    ports:
      - "7447:7447/tcp"
    volumes:
      - ./tests/configs/router-default.json5:/etc/zenoh/router.json5:ro
    networks:
      - bench-net

  # ── Publisher side ───────────────────────────────────────────────────────
  bench-pub:
    image: ${DEMO_IMAGE:-quay.io/jianrzha/ros2-zenoh-demo}:${DEMO_VERSION:-0.0.7}
    platform: linux/arm64
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_HOME: /tmp
    command: >
      bash -c "
        set +u && source /opt/ros/jazzy/setup.bash && set -u &&
        sleep ${PUB_SLEEP:-10} &&
        exec python3 /tests/bench_pub.py
          --rate ${RATE_HZ:-10}
          --duration ${PUB_DURATION:-80}
          --topic /bench
      "
    volumes:
      - ./tests:/tests:ro
    networks:
      - bench-net
    depends_on:
      - zenoh-router

  # Bridge sidecar: shares bench-pub's network namespace so it can discover
  # the DDS publisher on loopback, and can reach zenoh-router via bench-net.
  bridge-pub:
    image: ${BRIDGE_IMAGE:-quay.io/ecosystem-appeng/zenoh-bridge-ros2dds}:${BRIDGE_TAG:-1.9.0}
    platform: linux/arm64
    network_mode: "service:bench-pub"
    command: ["-c", "/etc/zenoh/bridge.json5"]
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ./tests/configs/bridge-baseline.json5:/etc/zenoh/bridge.json5:ro
    depends_on:
      - bench-pub

  # ── Subscriber side ──────────────────────────────────────────────────────
  bench-sub:
    image: ${DEMO_IMAGE:-quay.io/jianrzha/ros2-zenoh-demo}:${DEMO_VERSION:-0.0.7}
    platform: linux/arm64
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_HOME: /tmp
    command: >
      bash -c "
        set +u && source /opt/ros/jazzy/setup.bash && set -u &&
        sleep ${SUB_SLEEP:-20} &&
        exec python3 /tests/bench_sub.py
          --duration ${MEASURE_DURATION:-30}
          --warmup ${WARMUP_SECS:-5}
          --topic /bench
      "
    volumes:
      - ./tests:/tests:ro
    networks:
      - bench-net
    depends_on:
      - zenoh-router

  # Bridge sidecar: shares bench-sub's network namespace so it sees the DDS
  # subscriber on loopback, and can reach zenoh-router via bench-net.
  bridge-sub:
    image: ${BRIDGE_IMAGE:-quay.io/ecosystem-appeng/zenoh-bridge-ros2dds}:${BRIDGE_TAG:-1.9.0}
    platform: linux/arm64
    network_mode: "service:bench-sub"
    command: ["-c", "/etc/zenoh/bridge.json5"]
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ./tests/configs/bridge-baseline.json5:/etc/zenoh/bridge.json5:ro
    depends_on:
      - bench-sub

networks:
  bench-net:
    driver: bridge
