services:

  # ── Cloud tier ──────────────────────────────────────────────────────────────

  # Cloud router: accepts connections from cloud bridge clients AND the incoming
  # router-to-router federation link from edge-router.  Both use port 7447.
  # Port 8001 exposes the REST API to the host for admin space inspection (F3).
  cloud-router:
    image: quay.io/ecosystem-appeng/zenoh-router:latest
    platform: linux/arm64
    command: ["-c", "/etc/zenoh/router.json5"]
    ports:
      - "7447:7447/tcp"
      - "8001:8001/tcp"
    volumes:
      - ${CLOUD_ROUTER_CONFIG:-./tests/configs/router-cloud.json5}:/etc/zenoh/router.json5:ro
    networks:
      - cloud-net
      - wan-net

  # ROS 2 listener — DDS subscriber on localhost only.
  # Receives messages that have crossed the federation link from the edge tier.
  ros2-listener:
    image: ${DEMO_IMAGE:-quay.io/jianrzha/ros2-zenoh-demo}:${DEMO_VERSION:-0.0.7}
    platform: linux/arm64
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_HOME: /tmp
    command: >
      bash -c "
        set +u && source /opt/ros/jazzy/setup.bash && set -u &&
        sleep 15 &&
        exec ros2 run demo_nodes_cpp listener
      "
    depends_on:
      - cloud-router
    networks:
      - cloud-net

  # Bridge sidecar for the cloud listener pod.
  # Shares ros2-listener's network namespace (cloud-net) and connects to
  # cloud-router:7447.  Delivers inbound Zenoh messages to local DDS subscribers.
  zenoh-bridge-listener:
    image: quay.io/ecosystem-appeng/zenoh-bridge-ros2dds:latest
    platform: linux/arm64
    network_mode: "service:ros2-listener"
    command: ["-c", "/etc/zenoh/bridge.json5"]
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ./tests/configs/bridge-cloud.json5:/etc/zenoh/bridge.json5:ro
    depends_on:
      - ros2-listener

  # ── Edge tier ───────────────────────────────────────────────────────────────

  # Edge router: listens on 7448 for edge bridge clients and connects outbound
  # to cloud-router:7447 (via wan-net) to establish the federation link.
  # Port 8002 exposes the REST API to the host for admin space inspection (F3).
  # EDGE_ROUTER_CONFIG can be swapped between router-edge.json5 (no ACL, F1/F3)
  # and router-edge-acl.json5 (sensor/** blocked, F2).
  edge-router:
    image: quay.io/ecosystem-appeng/zenoh-router:latest
    platform: linux/arm64
    command: ["-c", "/etc/zenoh/router.json5"]
    ports:
      - "7448:7448/tcp"
      - "8002:8002/tcp"
    volumes:
      - ${EDGE_ROUTER_CONFIG:-./tests/configs/router-edge.json5}:/etc/zenoh/router.json5:ro
    networks:
      - edge-net
      - wan-net
    depends_on:
      - cloud-router

  # ROS 2 talker — publishes multiple test topics via DDS (localhost only).
  # multi-pub.sh publishes /chatter (10 Hz), /sensor/scan, /sensor/camera, /system/status.
  ros2-talker:
    image: ${DEMO_IMAGE:-quay.io/jianrzha/ros2-zenoh-demo}:${DEMO_VERSION:-0.0.7}
    platform: linux/arm64
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_HOME: /tmp
    command: >
      bash -c "
        set +u && source /opt/ros/jazzy/setup.bash && set -u &&
        echo '[talker] Waiting for bridge sidecar to settle...' &&
        sleep 12 &&
        exec bash /tests/multi-pub.sh
      "
    depends_on:
      - edge-router
    volumes:
      - ./tests:/tests:ro
    networks:
      - edge-net

  # Bridge sidecar for the edge talker pod.
  # Shares ros2-talker's network namespace (edge-net) so it sees DDS traffic on lo.
  # Connects to edge-router:7448 — it cannot reach cloud-router directly (cloud-net
  # is isolated).  All cross-tier routing goes through the federation link.
  zenoh-bridge-talker:
    image: quay.io/ecosystem-appeng/zenoh-bridge-ros2dds:latest
    platform: linux/arm64
    network_mode: "service:ros2-talker"
    command: ["-c", "/etc/zenoh/bridge.json5"]
    environment:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ./tests/configs/bridge-edge.json5:/etc/zenoh/bridge.json5:ro
    depends_on:
      - ros2-talker

networks:
  # Edge private network: edge router + talker (bridge sidecar inherits via network_mode)
  edge-net:
    driver: bridge

  # Cloud private network: cloud router + listener (bridge sidecar inherits via network_mode)
  cloud-net:
    driver: bridge

  # WAN network: only the two routers; enforces that bridges cannot cross tiers directly
  wan-net:
    driver: bridge
