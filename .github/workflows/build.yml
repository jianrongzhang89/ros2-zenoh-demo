name: Build and Push to Quay.io

on:
  push:
    branches: [main, zeno-dds-bridge]
  pull_request:
    branches: [main]

env:
  IMAGE:        quay.io/jianrzha/ros2-zenoh-demo
  ROUTER_IMAGE: quay.io/ecosystem-appeng/zenoh-router
  BRIDGE_IMAGE: quay.io/ecosystem-appeng/zenoh-bridge-ros2dds
  ECLIPSE_TAG:  "1.9.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build ros2-zenoh-demo (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ros2
          platforms: linux/arm64,linux/amd64
          push: false

      - name: Build and push ros2-zenoh-demo
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ros2
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push zenoh-router (UBI)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zenoh-router
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: ECLIPSE_TAG=${{ env.ECLIPSE_TAG }}
          tags: |
            ${{ env.ROUTER_IMAGE }}:latest
            ${{ env.ROUTER_IMAGE }}:${{ env.ECLIPSE_TAG }}

      - name: Build and push zenoh-bridge-ros2dds (UBI)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.zenoh-bridge
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: ECLIPSE_TAG=${{ env.ECLIPSE_TAG }}
          tags: |
            ${{ env.BRIDGE_IMAGE }}:latest
            ${{ env.BRIDGE_IMAGE }}:${{ env.ECLIPSE_TAG }}
