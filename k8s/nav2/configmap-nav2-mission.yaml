apiVersion: v1
kind: ConfigMap
metadata:
  name: nav2-mission
  namespace: ros2-zenoh-gazebo
data:
  patrol.py: |
    #!/usr/bin/env python3
    """
    Warehouse security patrol demo using Nav2 Simple Commander.

    The robot loops through four waypoints in the warehouse map frame,
    covering all four aisles.  Each lap is logged so progress is visible
    in 'kubectl logs … -c mission'.
    """
    import rclpy
    from nav2_simple_commander.robot_navigator import BasicNavigator, TaskResult
    from geometry_msgs.msg import PoseStamped
    import time


    def make_pose(nav, x, y, yaw_deg=0.0):
        import math
        pose = PoseStamped()
        pose.header.frame_id = 'odom'
        pose.header.stamp = nav.get_clock().now().to_msg()
        pose.pose.position.x = x
        pose.pose.position.y = y
        half = math.radians(yaw_deg) / 2.0
        pose.pose.orientation.z = math.sin(half)
        pose.pose.orientation.w = math.cos(half)
        return pose


    def main():
        rclpy.init()
        nav = BasicNavigator()

        print('[patrol] Waiting for Nav2 to become active...')
        # Odom-frame navigation: no AMCL, pass navigator='bt_navigator'
        # and localizer=None so waitUntilNav2Active skips the AMCL check.
        nav.waitUntilNav2Active(navigator='bt_navigator', localizer='bt_navigator')
        print('[patrol] Nav2 is active. Starting warehouse patrol.')

        # Odom-frame waypoints (global_frame=odom, relative to robot start).
        # Uses goToPose() in a loop — compatible with the simpler
        # navigate_w_replanning_time BT (no backup/recovery needed).
        waypoints = [
            make_pose(nav, -2.5,  0.0,   0.0),   # west  (odom frame)
            make_pose(nav,  0.0,  2.5,  90.0),   # north (odom frame)
            make_pose(nav,  2.5,  0.0, 180.0),   # east  (odom frame)
            make_pose(nav,  0.0, -2.5, 270.0),   # south (odom frame)
        ]

        lap = 0
        while rclpy.ok():
            lap += 1
            print(f'[patrol] Starting patrol lap {lap}')

            for i, wp in enumerate(waypoints):
                print(f'[patrol]   Navigating to waypoint {i+1}/{len(waypoints)}...')
                nav.goToPose(wp)

                while not nav.isTaskComplete():
                    feedback = nav.getFeedback()
                    if feedback:
                        remaining = getattr(feedback, 'distance_remaining', None)
                        if remaining is not None:
                            print(f'[patrol]   distance remaining: {remaining:.2f} m')
                    time.sleep(2.0)

                result = nav.getResult()
                if result == TaskResult.SUCCEEDED:
                    print(f'[patrol]   Waypoint {i+1} reached.')
                else:
                    print(f'[patrol]   Waypoint {i+1} failed ({result}), continuing.')
                    break

            print(f'[patrol] Lap {lap} complete.')


    if __name__ == '__main__':
        main()
